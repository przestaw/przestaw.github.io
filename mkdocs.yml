# Site metadata & build directories (read by Zensical via MkDocs compatibility).
site_name: Przemysław Stawczyk
site_url: https://przestaw.github.io/
site_description: Senior C++ / Python Engineer — low-latency, distributed & embedded systems, tutorials, and open-source projects.
docs_dir: docs
site_dir: site

# NOTE: Exclude Jekyll metadata, roadmap files, and the Polish translation
# source shipped inside submodules from standalone page generation.
# include-markdown reads README.pl.md directly from disk for /pl/boost-python/.
exclude_docs: |
  _config.yml
  TODO.md
  boost-python/README.pl.md

# Theme & color palette.
theme:
  name: material
  # Reusable przestaw dark theme layer, vendored as a Git submodule
  # (https://github.com/przestaw/zensical_przestaw).
  custom_dir: theme/zensical_przestaw/overrides
  variant: classic
  language: en
  features:
    - navigation.top
    - search.suggest
    - search.highlight
  # Dark-only: zensical_przestaw does not support a light color scheme.
  palette:
    scheme: slate
    primary: black
    accent: green

extra_javascript:
  - javascripts/portfolio-config.js

# The portfolio config owns locale routes within this single build.
# extra.alternate expects separate localized sites and rewrites these links incorrectly.
extra:
  przestaw:
    portfolio: true

# Site navigation (mirrored by consumer-owned portfolio-config.js data).
nav:
  - EN:
      - Home: index.md
      - Projects: projects/index.md
      - Boost.Python: boost-python/README.md
      - workctl: workctl/index.md
  - PL:
      - Start: pl/index.md
      - Projekty: pl/projekty/index.md
      - Boost.Python: pl/boost-python/index.md
      - workctl: pl/workctl/index.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  # Include only selected Markdown from content submodules, not their source trees.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - include-markdown
