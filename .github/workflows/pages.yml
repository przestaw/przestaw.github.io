# Build and deploy the bilingual Zensical site to GitHub Pages.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Least-privilege permissions required for GitHub Pages OIDC deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# NOTE: Allow one active Pages deployment at a time without cancelling an
# in-progress production rollout; queued runs fast-forward to the latest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Fetch pinned content and theme submodules, including the README-only workctl import.
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          # CONTENT_READ_TOKEN is a fine-grained, read-only token scoped only to
          # private content/theme repositories. It is never persisted in the checkout.
          token: ${{ secrets.CONTENT_READ_TOKEN }}
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Zensical
        run: python -m pip install -r requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: zensical build --clean

      # Scan the actual artifact, including search data and assets, without logging contact values.
      - name: Check published contact privacy
        run: |
          python - <<'PY'
          import html
          import pathlib
          import re
          import urllib.parse

          email = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          contact = re.compile(r"""\b(?:href|src)\s*=\s*["'](?:mailto|tel):""", re.I)
          assert email.search("person@example.test")
          assert email.search(html.unescape("person&#64;example.test"))
          assert contact.search('<a href="tel:+123456789">')
          assert not contact.search('const protocols = ["tel:", "https:"];')
          assert not email.search("https://github.com/przestaw")

          site = pathlib.Path("site")
          if not (site / "index.html").is_file():
              raise SystemExit("Missing built site/index.html")
          violations = []
          for path in site.rglob("*"):
              if path.is_file() and path.suffix.lower() in {".html", ".json", ".xml", ".js", ".css", ".txt", ".map"}:
                  text = html.unescape(urllib.parse.unquote(path.read_text(encoding="utf-8")))
                  if email.search(text) or contact.search(text):
                      violations.append(path.relative_to(site).as_posix())
          if violations:
              raise SystemExit("Contact privacy check failed in: " + ", ".join(violations))
          print("Contact privacy check passed")
          PY

      # Keep the standalone research submodule out of the main site's discovery indexes.
      - name: Scope search and sitemap to the main site
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          site = pathlib.Path("site")
          search = site / "search.json"
          if search.exists():
              data = json.loads(search.read_text(encoding="utf-8"))
              data["items"] = [
                  item for item in data["items"]
                  if not item.get("location", "").startswith("om-5-firmware-patches/")
              ]
              search.write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")

          sitemap = site / "sitemap.xml"
          if sitemap.exists():
              txt = sitemap.read_text(encoding="utf-8")
              txt = re.sub(r"\s*<url>\s*<loc>[^<]*/om-5-firmware-patches/[^<]*</loc>\s*</url>", "", txt)
              sitemap.write_text(txt, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
