# Build and deploy the bilingual Zensical site to GitHub Pages.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Least-privilege permissions required for GitHub Pages OIDC deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# NOTE: Allow one active Pages deployment at a time without cancelling an
# in-progress production rollout; queued runs fast-forward to the latest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Fetch content and theme submodules (docs/boost-python, theme/zensical_przestaw).
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Zensical
        run: python -m pip install -r requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
